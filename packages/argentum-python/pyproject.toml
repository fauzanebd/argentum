[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argentum"
version = "0.1.0"
description = "The Argentum API from Python: a spec in and a PDF out, a prompt in and a report back, a question in and an answer streamed."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "UNLICENSED" }
keywords = ["argentum", "reports", "pdf", "analytics"]
# One dependency, and it is the one that makes the sync and async clients the
# same client: httpx speaks both with one request API, so the retry, the
# idempotency key and the error mapping have a single definition rather than
# two that drift.
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Documentation = "https://github.com/fauzanebd/argentum/blob/main/docs/api/quickstart.md"

[tool.hatch.build.targets.wheel]
packages = ["src/argentum"]
