# TypeScript generation for packages/api-types (T-02b).
#
# Run from this directory (tygo resolves package paths through the Go module),
# which is what `make types` and packages/api-types/scripts/generate.mjs do.
# The output is post-processed by that script and committed; CI regenerates and
# diffs, so a Go struct change without `make types` is a red build.
#
# `enum_style: union` renders a Go string enum as a literal union rather than
# as a bare `string`, which is what makes this generator worth having for the
# dashboard: adding a channel in Go widens the union, and any `switch` that no
# longer covers every case fails the dashboard's build. A `type Channel =
# string` would let that ship silently — which is exactly what happened to the
# hand-written type it replaces, still claiming `"whatsapp" | "dashboard"` two
# channels after Discord and Lark landed.
#
# tygo only forms the union when every constant's name begins with the type's
# name: `ChannelWhatsApp` does, `UsageEventLLMCall` and `APIReportQueued` do
# not, and those still come out as `= string` with named constants beside them.
# The result is uniform in behaviour if not in strength — a union is assignable
# everywhere the alias was — and the alternative is renaming domain constants
# to suit a TypeScript generator, which is the tail wagging the dog.
type_mappings:
  time.Time: "string"
  json.RawMessage: "unknown"

packages:
  # The entities. Everything the dashboard reads out of `/api` is one of these
  # or a list of them.
  - path: "github.com/fauzanebd/argentum/internal/domain"
    output_path: "../../packages/api-types/src/domain.ts"
    enum_style: "union"
    # domain.Dashboard carries the stored spec, which lives in its own package.
    # Aliased on import because both types are called `Dashboard` in Go and the
    # names would collide here: one is the row, the other is what is in its
    # JSONB column.
    type_mappings:
      spec.Dashboard: "DashboardSpec"
      # A document table's columns are `internal/doctable`'s decision, and the
      # review surface edits them (T-P7). Without these two the field lands as
      # `unknown` with the Go name in a comment, which is precisely the
      # hand-written-type gap T-02b closed.
      doctable.Column: "DocumentColumn"
      doctable.VerifyStatus: "DocumentVerifyStatus"
    frontmatter: |
      /* eslint-disable */
      // Entities, from apps/backend/internal/domain.
      import type { Dashboard as DashboardSpec } from "./dashboardspec.js";
      import type {
        Column as DocumentColumn,
        VerifyStatus as DocumentVerifyStatus,
      } from "./doctable.js";

  # The dashboard spec (T-D4) and the resolved panels a browser draws.
  #
  # Not barrelled, for the reason videoplan is not: `Dashboard`, `Panel`,
  # `Filter`, `Layout` and `Series` are names a shared namespace should not be
  # handed. Import them from "@argentum/api-types/dashboard-spec".
  - path: "github.com/fauzanebd/argentum/internal/dashboard/spec"
    include_files:
      - "spec.go"
      - "project.go"
      - "window.go"
    output_path: "../../packages/api-types/src/dashboardspec.ts"
    enum_style: "union"
    frontmatter: |
      /* eslint-disable */
      // The stored dashboard spec and one resolved panel, from
      // apps/backend/internal/dashboard/spec. A panel stores a question and a
      // column mapping — never values — so everything here describes what to
      // ask, and `Resolved` is what came back.

  # One resolve: every panel's answer plus what the filters resolved to.
  # Import from "@argentum/api-types/dashboard".
  - path: "github.com/fauzanebd/argentum/internal/dashboard"
    include_files:
      - "result.go"
      - "input.go"
    output_path: "../../packages/api-types/src/dashboard.ts"
    enum_style: "union"
    type_mappings:
      spec.Resolved: "Resolved"
      spec.Window: "Window"
      spec.Dashboard: "DashboardSpec"
      domain.Dashboard: "Dashboard"
    frontmatter: |
      /* eslint-disable */
      // What `GET /api/dashboards/:id/data` answers, from
      // apps/backend/internal/dashboard.
      import type {
        Dashboard as DashboardSpec,
        Resolved,
        Window,
      } from "./dashboardspec.js";
      import type { Dashboard } from "./domain.js";

  # The streaming half of the contract, and the one with the most drift risk:
  # nothing about a WebSocket frame is documented anywhere else.
  #
  # Only two files, because `internal/app` is the service layer — generating
  # all of it would put ChatInput, AgentSpec and every other internal shape
  # into a package whose whole promise is "these cross the wire".
  - path: "github.com/fauzanebd/argentum/internal/app"
    include_files:
      - "event_bus.go"
      - "budget_state.go"
    output_path: "../../packages/api-types/src/events.ts"
    enum_style: "union"
    frontmatter: |
      /* eslint-disable */
      // WebSocket frames and the credit position, from apps/backend/internal/app.

  # Responses that are neither entities nor events. One file, by design: see
  # its package comment for what belongs in it.
  - path: "github.com/fauzanebd/argentum/internal/transport/http/handlers"
    include_files:
      - "wire.go"
    output_path: "../../packages/api-types/src/api.ts"
    enum_style: "union"
    # tygo resolves types within a package, not across them: without this,
    # `*app.BudgetState` lands as the fallback type with the Go name in a
    # comment beside it. The frontmatter below imports the real one.
    type_mappings:
      app.BudgetState: "BudgetState"
      domain.Agent: "Agent"
      domain.AgentChannelBinding: "AgentChannelBinding"
      domain.Channel: "Channel"
      domain.CompanyProfile: "CompanyProfile"
      domain.APIKey: "APIKey"
      domain.APIKeyRequestStats: "APIKeyRequestStats"
      domain.APIRequestError: "APIRequestError"
      domain.MCPServer: "MCPServer"
      domain.MCPTransport: "MCPTransport"
      domain.MetricDefinition: "MetricDefinition"
      domain.MetricGrain: "MetricGrain"
      domain.MetricUnit: "MetricUnit"
    frontmatter: |
      /* eslint-disable */
      // `/api` response bodies that are not domain entities, from
      // apps/backend/internal/transport/http/handlers/wire.go.
      import type { BudgetState } from "./events.js";
      import type {
        Agent,
        AgentChannelBinding,
        APIKey,
        APIKeyRequestStats,
        APIRequestError,
        Channel,
        CompanyProfile,
        MCPServer,
        MCPTransport,
        MetricDefinition,
        MetricGrain,
        MetricUnit,
      } from "./domain.js";

  # What was extracted from an uploaded PDF (T-P4/T-P7): the typed columns, the
  # rows, the page rectangles and the arithmetic verdict. Generated rather than
  # hand-written because the review surface renders every field of it, and a
  # hand-written copy of a Go struct is the defect T-02b deleted four files to
  # end.
  - path: "github.com/fauzanebd/argentum/internal/doctable"
    include_files:
      - "doctable.go"
      - "verify.go"
      - "continuation.go"
    output_path: "../../packages/api-types/src/doctable.ts"
    enum_style: "union"
    frontmatter: |
      /* eslint-disable */
      // One table extracted from an uploaded PDF, from
      // apps/backend/internal/doctable. A draft until a person applies it: the
      // review surface reads every field here, and `verify` is what decides
      // whether the Apply control is enabled at all.

  # One page of a parse, as the review surface draws it: the markdown, the word
  # boxes and the table rectangles. A reviewer who cannot see the page cannot
  # review the parse, and this is what they see it through.
  - path: "github.com/fauzanebd/argentum/internal/docparse"
    include_files:
      - "client.go"
    output_path: "../../packages/api-types/src/docparse.ts"
    enum_style: "union"
    frontmatter: |
      /* eslint-disable */
      // One parsed page, from apps/backend/internal/docparse.

  # The video plan (T-V1). Generated because two TypeScript consumers compile
  # against it — apps/render draws it and the dashboard's player replays it —
  # and a hand-written interface matching a Go struct is the exact defect T-02b
  # deleted four files to end. It is the only report package that crosses the
  # wire, which is why the rest of internal/report is not here.
  - path: "github.com/fauzanebd/argentum/internal/report/videoplan"
    include_files:
      - "plan.go"
    output_path: "../../packages/api-types/src/videoplan.ts"
    enum_style: "union"
    frontmatter: |
      /* eslint-disable */
      // The video plan, from apps/backend/internal/report/videoplan/plan.go.
      // Every string in it is final: nothing on this side formats a number,
      // picks a word, or decides how long a scene is on screen.

  # Inbound webhook envelopes. Named by the ticket, and generated for the same
  # reason the rest is — but deliberately not re-exported from the package
  # index: these are what Meta and Twilio send *us*, no browser ever sees one,
  # and `models.Message` would collide with `domain.Message` in a barrel. Import
  # them from "@argentum/api-types/webhooks" if you ever need one.
  - path: "github.com/fauzanebd/argentum/pkg/models"
    output_path: "../../packages/api-types/src/webhooks.ts"
    enum_style: "union"
    frontmatter: |
      /* eslint-disable */
      // Inbound WhatsApp / Twilio webhook envelopes, from apps/backend/pkg/models.
