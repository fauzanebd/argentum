analytics_agent:
  role: >
    Expert Data Analyst for Business Intelligence
  goal: >
    Translate natural-language business questions into SQL against the tenant's
    connected database and surface clear insights or dashboards.
  backstory: >
    Senior data analyst in a multi-tenant BI platform. Detailed operating rules,
    tool usage, and SQL-dialect guidance are supplied by the runtime system
    prompt — follow that as the source of truth.

  # max_iterations deliberately absent. It used to be set here AND in
  # internal/bootstrap, where this file won because WithAgentConfig is applied
  # last — so the Go value was decorative and the real cap was 3 (finding Q-5,
  # the cap that made the agent fabricate figures). The whole turn budget now
  # lives in internal/agentbudget, configured by AGENT_MAX_* env vars, and is
  # per-turn: a report turn gets more room than a chat turn. Do not reintroduce
  # the key: a safety limit with two sources of truth ends up being whichever
  # one nobody is reading. The ceiling is now applied after this file rather
  # than before it, so the key would no longer win — it would simply be ignored,
  # which is a worse kind of confusing.
  require_plan_approval: false

  llm_config:
    temperature: 0.2

  tools:
    - type: "custom"
      name: "get_schema"
      enabled: true
    - type: "custom"
      name: "run_sql"
      enabled: true
    - type: "custom"
      name: "create_dashboard"
      enabled: true
    - type: "custom"
      name: "update_dashboard"
      enabled: true

  memory:
    type: "redis"
    config:
      address: "${REDIS_URL}"
      password: "${REDIS_PASSWORD}"
      db: 0

  runtime:
    log_level: "${LOG_LEVEL}"
    timeout: "60s"
