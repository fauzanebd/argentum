services:
  # Postgres for the Argentum control plane.
  postgres:
    image: ankane/pgvector:latest
    container_name: argentum_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-argentum}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-argentum123}
      POSTGRES_DB: ${DB_NAME:-argentum}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Ensures MB_DB_DBNAME exists before Metabase starts (fresh volumes only).
      - ./docker/postgres-docker-init-metabase.sql:/docker-entrypoint-initdb.d/01-metabase_app.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-argentum} -d ${DB_NAME:-argentum}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [ argentum_network ]

  # Demo tenant Postgres (for local development only). The seeded star
  # schema lets you exercise the full chat/dashboard flow without bringing
  # your own data warehouse.
  # Same image family as postgres (bundles pgvector). postgres:16-alpine cannot run
  # 004_enable_pgvector.sql — there is no vector extension on disk.
  postgres_demo:
    image: ankane/pgvector:latest
    container_name: argentum_postgres_demo
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo_analytics
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
      - ./migrations/demo_tenant:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U demo -d demo_analytics" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [ argentum_network ]
    profiles: [ dev ]

  redis:
    image: redis:7-alpine
    container_name: argentum_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      # Redis listens on 6379 in the image; expose as 6380 on the host (matches REDIS_URL default in .env).
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [ argentum_network ]

  # Object storage for everything the product hands back as a file: the agent's
  # generate_document, `/v1/reports` (T-A2), and the tenant logo T-R5 renders
  # into a branded PDF.
  #
  # It is not optional decoration for a developer. `deps.docGen` is nil without
  # MINIO_ENDPOINT, so `POST /v1/reports/render` answers `rendering_unavailable`,
  # `generate_document` is absent from the tool registry, and T-A2b's eval case
  # cannot pass — a whole track's worth of work that could not be exercised
  # locally at all until this service existed (T-S4's gate, 2026-07-31).
  #
  # Root credentials are the MINIO_ACCESS_KEY / MINIO_SECRET_KEY the app reads,
  # so one pair configures both ends. Defaults are MinIO's own well-known
  # minioadmin pair, matching the other services here — every credential in this
  # file is a local default and none of them belong in a deployment.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: argentum_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      # 9000 is the S3 API the app talks to; 9001 is the browser console, which
      # is how you check that a document really landed.
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [ argentum_network ]

  metabase:
    image: metabase/metabase:v0.60.x
    container_name: argentum_metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_app
      MB_DB_PORT: 5432
      MB_DB_USER: ${DB_USER:-argentum}
      MB_DB_PASS: ${DB_PASSWORD:-argentum123}
      MB_DB_HOST: postgres
      MB_JETTY_PORT: 3000
      MB_ENABLE_EMBEDDING: "true"
      MB_EMBEDDING_SECRET_KEY: ${MB_EMBEDDING_SECRET:-change_me_in_production}
      JAVA_OPTS: "-Xmx2g -Xms1g"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    networks: [ argentum_network ]

  # Trace collector (T-17). Jaeger all-in-one speaks OTLP natively, so it is
  # both the collector and the UI — no separate otel-collector process to
  # configure for a local waterfall. Off by default: the `tracing` profile
  # starts it, and nothing exports until OTEL_EXPORTER_OTLP_ENDPOINT is set on
  # api/worker/discord (see .env.example). A stack without it behaves exactly
  # as before, which is the property internal/tracing was built to keep.
  #
  #   docker compose --profile tracing up -d jaeger
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 \
  #   OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf docker compose up -d api worker
  #   open http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: argentum_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # In-memory storage: a local waterfall is read minutes after it is
      # produced, and a volume would outlive the question it answers.
      SPAN_STORAGE_TYPE: memory
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks: [ argentum_network ]
    profiles: [ tracing ]

  # ngrok for WhatsApp webhook tunneling (development only)
  ngrok:
    image: ngrok/ngrok:latest
    container_name: argentum_ngrok
    command: start --all --config /etc/ngrok.yml
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    networks: [ argentum_network ]
    profiles: [ dev ]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: argentum_api
    environment:
      ENV: ${ENV:-development}
      PORT: 8080
      LOG_LEVEL: info

      # Control plane Postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-argentum}
      DB_PASSWORD: ${DB_PASSWORD:-argentum123}
      DB_NAME: ${DB_NAME:-argentum}
      DB_SSL_MODE: disable
      CONTROL_MIGRATIONS_DIR: /app/migrations/control

      REDIS_URL: redis://redis:6379

      # LLM
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5}
      LIGHT_LLM_PROVIDER: ${LIGHT_LLM_PROVIDER:-openai}
      LIGHT_LLM_API_KEY: ${LIGHT_LLM_API_KEY}
      LIGHT_LLM_MODEL: ${LIGHT_LLM_MODEL:-gpt-5-mini}
      LIGHT_LLM_BASE_URL: ${LIGHT_LLM_BASE_URL:-}

      # Metabase
      METABASE_URL: http://metabase:3000
      METABASE_PUBLIC_URL: ${METABASE_PUBLIC_URL:-http://localhost:3000}
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:-argentum@test.com}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:-Metabase123!}

      # WhatsApp / Twilio
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-twilio}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v18.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}

      # Argentum-specific secrets (REQUIRED)
      ARGENTUM_JWT_SECRET: ${ARGENTUM_JWT_SECRET}
      ARGENTUM_DSN_KEY: ${ARGENTUM_DSN_KEY}

      # Object storage. The endpoint is the compose service, which is also the
      # host a presigned download URL is signed for — SigV4 covers the Host
      # header, so a link minted in here reads `http://minio:9000/...` and is
      # only openable from inside this network. An API run on the host against
      # this same MinIO (the usual local flow) uses localhost:9000 and its links
      # work in a browser.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-argentum-documents}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}

      # Frontend origin allowlist
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      # Observability (T-17). Unset METRICS_TOKEN → /metrics answers on
      # loopback only, which from outside the container means "not at all";
      # set it to scrape from the host. Unset OTLP endpoint → no tracer
      # provider is installed at all.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks: [ argentum_network ]

  # Worker process: pulls chat:run tasks off Redis (asynq) and runs the
  # agent. Shares all env with api, plus tunables for concurrency.
  # The video renderer (T-V2). A browser and ffmpeg, in their own container,
  # reachable only from the worker. It holds no credential and makes no
  # outbound call: the plan it is sent carries its own chart images and logo.
  render:
    build:
      # The repo root: the image installs the pnpm workspace, which lives above
      # this file. A context of `..` would put pnpm-workspace.yaml out of reach.
      context: ../..
      dockerfile: apps/render/Dockerfile
    container_name: argentum_render
    environment:
      RENDER_PORT: 8090
      RENDER_SHARED_SECRET: ${RENDER_SHARED_SECRET:-}
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    networks: [ argentum_network ]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: argentum_worker
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: info

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-argentum}
      DB_PASSWORD: ${DB_PASSWORD:-argentum123}
      DB_NAME: ${DB_NAME:-argentum}
      DB_SSL_MODE: disable

      REDIS_URL: redis://redis:6379
      ASYNQ_REDIS_URL: ${ASYNQ_REDIS_URL:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      WORKER_QUEUES: ${WORKER_QUEUES:-default:10}

      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5}
      LIGHT_LLM_PROVIDER: ${LIGHT_LLM_PROVIDER:-openai}
      LIGHT_LLM_API_KEY: ${LIGHT_LLM_API_KEY}
      LIGHT_LLM_MODEL: ${LIGHT_LLM_MODEL:-gpt-5-mini}
      LIGHT_LLM_BASE_URL: ${LIGHT_LLM_BASE_URL:-}

      METABASE_URL: http://metabase:3000
      METABASE_PUBLIC_URL: ${METABASE_PUBLIC_URL:-http://localhost:3000}
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:-argentum@test.com}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:-Metabase123!}

      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-twilio}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v18.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}

      ARGENTUM_JWT_SECRET: ${ARGENTUM_JWT_SECRET}
      ARGENTUM_DSN_KEY: ${ARGENTUM_DSN_KEY}

      THREAD_IDLE_MINUTES: ${THREAD_IDLE_MINUTES:-30}
      SUMMARY_EVERY_N_TURNS: ${SUMMARY_EVERY_N_TURNS:-8}
      LLM_CLASSIFIER_MODEL: ${LLM_CLASSIFIER_MODEL:-gpt-5-nano}

      # The worker is where generate_document actually runs: without these the
      # tool is not registered at all and the agent answers that it cannot
      # produce a file.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-argentum-documents}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}

      # The turn span starts here, so a waterfall with no worker export is the
      # half of the trace nobody wants.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_started
    networks: [ argentum_network ]

  # Discord gateway process: holds one discordgo session per enabled tenant,
  # routes inbound DM/mention/reply messages into the chat pipeline, and
  # delivers worker-produced replies via Redis pub/sub.
  discord:
    build:
      context: .
      dockerfile: Dockerfile.discord
    container_name: argentum_discord
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: info

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-argentum}
      DB_PASSWORD: ${DB_PASSWORD:-argentum123}
      DB_NAME: ${DB_NAME:-argentum}
      DB_SSL_MODE: disable

      REDIS_URL: redis://redis:6379
      ASYNQ_REDIS_URL: ${ASYNQ_REDIS_URL:-}

      ARGENTUM_JWT_SECRET: ${ARGENTUM_JWT_SECRET}
      ARGENTUM_DSN_KEY: ${ARGENTUM_DSN_KEY}

      THREAD_IDLE_MINUTES: ${THREAD_IDLE_MINUTES:-30}
      SUMMARY_EVERY_N_TURNS: ${SUMMARY_EVERY_N_TURNS:-8}

      DISCORD_ENABLED: ${DISCORD_ENABLED:-true}

      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks: [ argentum_network ]

  # Argentum dashboard (Vite dev server in dev profile, static nginx in prod).
  dashboard:
    build:
      context: ../argentum-dashboard
      dockerfile: Dockerfile
    container_name: argentum_dashboard
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on:
      - api
    ports:
      - "5173:80"
    networks: [ argentum_network ]
    profiles: [ prod ]

volumes:
  postgres_data:
  postgres_demo_data:
  redis_data:
  metabase_data:
  minio_data:

networks:
  argentum_network:
    driver: bridge
