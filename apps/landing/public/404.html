<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found · Argentum</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #16181a;
        color: #f0f0ee;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      }
      main { max-width: 440px; text-align: center; }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: linear-gradient(135deg, #f25c5c, #fb7185);
        color: #212427;
        font-weight: 700;
        font-size: 18px;
      }
      h1 { margin-top: 28px; font-size: 34px; letter-spacing: -0.03em; }
      p { margin-top: 12px; color: rgba(255, 255, 255, 0.6); line-height: 1.6; }
      a.btn {
        display: inline-block;
        margin-top: 28px;
        padding: 12px 24px;
        border-radius: 999px;
        background: linear-gradient(120deg, #f25c5c, #fb7185);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark">A</span>
      <h1>No rows match that query.</h1>
      <p>The page you asked for doesn't exist. The analyst does, though.</p>
      <a class="btn" href="/">Back to Argentum</a>
    </main>
  </body>
</html>
