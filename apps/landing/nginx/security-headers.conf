# Included in every location of default.conf. nginx drops server-level
# add_header directives inside any location that sets its own add_header, so
# these are repeated per location through this include rather than declared once.
#
# HSTS has no includeSubDomains: other *.smartsoft.co.id hosts are not all
# HTTPS-only, and this header would bind them too.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
