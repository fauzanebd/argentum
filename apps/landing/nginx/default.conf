# Argentum landing — static files behind Traefik (TLS terminates there).
#
# The landing has no client-side routes, so unknown paths are a real 404 rather
# than index.html. /docs/ resolves through `$uri/` to the built docs pages.

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  # Traefik terminates TLS, so nginx sees plain http on :80. Relative redirects
  # (/docs -> /docs/) keep the browser on https instead of bouncing via http.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/yaml image/svg+xml;

  error_page 404 /404.html;
  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Vite fingerprints everything under /assets/, so a file there never changes.
  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # The OpenAPI spec: show it in the browser instead of downloading it.
  location ~* \.ya?ml$ {
    types { }
    default_type "text/plain; charset=utf-8";
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # HTML and everything else: always revalidate, so a deploy shows up at once.
  location / {
    try_files $uri $uri/ =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
