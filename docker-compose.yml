services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: ankane/pgvector:latest
    container_name: analytics_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-analytics}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-analytics123}
      POSTGRES_DB: ${DB_NAME:-analytics_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-analytics} -d ${DB_NAME:-analytics_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - analytics_network

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: analytics_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - analytics_network

  # Redis for Caching
  redis:
    image: redis:7-alpine
    container_name: analytics_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6380"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - analytics_network

  # Metabase for Dashboards
  metabase:
    image: metabase/metabase:v0.48.0
    container_name: analytics_metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_app
      MB_DB_PORT: 5432
      MB_DB_USER: ${DB_USER:-analytics}
      MB_DB_PASS: ${DB_PASSWORD:-analytics123}
      MB_DB_HOST: postgres
      MB_JETTY_PORT: 3000
      MB_ENABLE_EMBEDDING: "true"
      MB_EMBEDDING_SECRET_KEY: ${MB_EMBEDDING_SECRET:-change_me_in_production}
      JAVA_OPTS: "-Xmx2g -Xms1g"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    networks:
      - analytics_network

  # ngrok for WhatsApp webhook tunneling (development only)
  ngrok:
    image: ngrok/ngrok:latest
    container_name: analytics_ngrok
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    networks:
      - analytics_network
    profiles:
      - dev

  # API Server (WhatsApp Webhook Handler)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: analytics_api
    environment:
      - ENV=${ENV:-development}
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-analytics}
      - DB_PASSWORD=${DB_PASSWORD:-analytics123}
      - DB_NAME=${DB_NAME:-analytics_db}
      - DB_SSL_MODE=disable
      - REDIS_URL=redis:6380
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672/
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION:-v18.0}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
    command: ["./api"]
    networks:
      - analytics_network

  # Agent Worker (Queue Consumer)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: analytics_worker
    environment:
      - ENV=${ENV:-development}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-analytics}
      - DB_PASSWORD=${DB_PASSWORD:-analytics123}
      - DB_NAME=${DB_NAME:-analytics_db}
      - DB_SSL_MODE=disable
      - REDIS_URL=redis:6380
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672/
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - METABASE_URL=http://metabase:3000
      - METABASE_ADMIN_EMAIL=${METABASE_ADMIN_EMAIL:-admin@example.com}
      - METABASE_ADMIN_PASSWORD=${METABASE_ADMIN_PASSWORD:-Metabase123!}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION:-v18.0}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      metabase:
        condition: service_started
    volumes:
      - ./:/app
    command: ["./worker"]
    networks:
      - analytics_network

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  metabase_data:

networks:
  analytics_network:
    driver: bridge
