name: Release

# Auto-tags the whole monorepo when the backend changes. Scoped explicitly to
# apps/backend so dashboard, landing, widget, docs, or packages changes do not
# mint a backend release tag.
#
# NOTE: this tag versions the deployed backend images. When packages/widget-*
# start publishing to npm (T-22), those get independent versions via changesets
# — do not couple npm package versions to this tag.
on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/release.yaml'

jobs:
  release:
    name: Create Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.PAT }}
          default_bump: patch
          tag_prefix: v
          release_branches: main

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: Argentum ${{ steps.tag.outputs.new_tag }}
          body: |
            ## Changes
            ${{ steps.tag.outputs.changelog }}
          generate_release_notes: true
