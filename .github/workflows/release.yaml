name: Release

# Auto-tags the whole monorepo when the backend changes. Scoped explicitly to
# apps/backend so dashboard, landing, widget, docs, or packages changes do not
# mint a backend release tag.
#
# NOTE: this tag versions the deployed backend images. When packages/widget-*
# start publishing to npm (T-22), those get independent versions via changesets
# — do not couple npm package versions to this tag.
#
# NOTE: the tag can lag main badly, so do not read main's history as the
# release history. v0.41.2 (4caf1fa) was followed by fifteen backend commits —
# nine of them feat:, including the Slack channel, watchers, the trace that
# survives the queue, the video renderer and embed auth — and no tag was minted
# for any of them. Two things worth checking before assuming a release went
# out: this workflow's own runs, and whether secrets.PAT is still valid. The
# same token mints the tag here and logs in to GHCR in ci.yaml, so a single
# expiry stops both the release and the images with nothing failing loudly.
on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/release.yaml'

jobs:
  release:
    name: Create Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.PAT }}
          default_bump: patch
          tag_prefix: v
          release_branches: main

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: Argentum ${{ steps.tag.outputs.new_tag }}
          body: |
            ## Changes
            ${{ steps.tag.outputs.changelog }}
          generate_release_notes: true
