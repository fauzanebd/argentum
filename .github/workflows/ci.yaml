name: CI

# No top-level `paths:` filter. The pre-monorepo workflow filtered the whole
# trigger on '**.go', which meant a frontend-only or config-only change ran no
# CI at all (gap Q-3). Filtering now happens per-job via the `changes` job, so
# every push is evaluated and only the relevant jobs execute.
on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: haritsrizkall
  # Matches apps/backend/go.mod (go 1.26.1). Previously pinned to 1.25, which
  # silently triggered a GOTOOLCHAIN=auto toolchain download on every run.
  GO_VERSION: '1.26'
  PNPM_VERSION: '10'
  NODE_VERSION: '22'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      tokens: ${{ steps.filter.outputs.tokens }}
      report: ${{ steps.filter.outputs.report }}
      api: ${{ steps.filter.outputs.api }}
      types: ${{ steps.filter.outputs.types }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - '.github/workflows/ci.yaml'
            # Both generated outputs are listed, not just the source: the point
            # of the tokens job is to catch a hand edit to a generated file as
            # well as a tokens.json change that was never regenerated.
            tokens:
              - 'packages/design-tokens/**'
              - 'apps/dashboard/src/tokens.generated.css'
              - 'apps/backend/internal/report/theme/**'
              # packages/motion is here for two reasons: it holds a generated
              # token module like the two above, and T-V5's colour check reads
              # every component in it — so a hard-coded colour in a scene has
              # to trigger this job even when tokens.json did not change.
              - 'packages/motion/**'
              - 'Makefile'
              - '.github/workflows/ci.yaml'
            # The deck smoke test installs LibreOffice, which costs about a
            # minute. It is worth that on a change to the renderers and nothing
            # at all on a change anywhere else, so it gets its own filter rather
            # than riding along in the backend job.
            report:
              - 'apps/backend/internal/report/**'
              - 'apps/backend/internal/tools/generate_document.go'
              - '.github/workflows/ci.yaml'
            # The dashboard's types, and the Go they are generated from. The
            # generated output is listed as well as the source, for the same
            # reason the tokens filter lists both: a hand edit to a generated
            # file has to trip the job that would overwrite it.
            types:
              - 'apps/backend/internal/domain/**'
              - 'apps/backend/internal/app/event_bus.go'
              - 'apps/backend/internal/app/budget_state.go'
              - 'apps/backend/internal/transport/http/handlers/wire.go'
              - 'apps/backend/pkg/models/**'
              - 'apps/backend/tygo.yaml'
              - 'packages/api-types/**'
              - 'Makefile'
              - '.github/workflows/ci.yaml'
            # The published contract and everything generated from it. The
            # samples are executed rather than read, so a change to a handler
            # has to re-run them too — hence the backend paths.
            api:
              - 'apps/backend/openapi/**'
              - 'apps/backend/internal/transport/http/**'
              - 'apps/backend/cmd/api/**'
              - 'docs/api/**'
              - 'packages/argentum-node/**'
              - 'packages/argentum-python/**'
              - 'packages/openapi-tools/**'
              - '.github/workflows/ci.yaml'
            web:
              - 'apps/dashboard/**'
              - 'apps/landing/**'
              - 'apps/widget/**'
              - 'packages/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              # The landing app publishes these as static pages
              # (apps/landing/scripts/build-docs.mjs), and its build fails on a
              # link that resolves to nothing. Editing the quickstart is
              # therefore a way to break the published site without touching
              # apps/, so the job that would catch it has to run on them.
              - 'docs/api/**'
              - 'apps/backend/openapi/**'
              - 'apps/backend/docs/postman/**'
              - '.github/workflows/ci.yaml'

  backend:
    name: Backend
    needs: changes
    # Tag pushes must always run this job: `dorny/paths-filter` has no base ref to
    # diff a tag against, so it reports no changes, which would skip this job —
    # and skipping it cascades to `docker` (a skipped dependency skips its
    # dependents), silently stopping image publication on every release.
    if: needs.changes.outputs.backend == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      # golangci-lint also runs govet, so the step above is strictly redundant.
      # It stays because it is two seconds and it fails with a plain compiler
      # message; a vet finding should not arrive dressed as a lint finding.
      # The config is apps/backend/.golangci.yml — five linters plus a gofmt
      # check, deliberately narrow (T-02).
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
          working-directory: apps/backend

      - name: Test
        run: go test -race -count=1 ./...

      # cmd/discord was never built by the pre-monorepo pipeline — a compile
      # error in the Discord gateway could reach main undetected.
      - name: Build binaries
        run: |
          go build -o /tmp/api     ./cmd/api
          go build -o /tmp/worker  ./cmd/worker
          go build -o /tmp/discord ./cmd/discord

  tokens:
    name: Design tokens
    needs: changes
    if: needs.changes.outputs.tokens == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The generators have no dependencies on purpose, so this job installs
      # nothing: node runs them, and Go is here only for the gofmt check inside
      # `make tokens`.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/backend/go.sum

      - name: Regenerate design tokens
        run: make tokens

      # A palette edit that reads fine on a monitor can be unreadable to a
      # red-green-deficient reader or on a monochrome printer, and neither
      # failure shows up in a diff. This is the gate that saw the original
      # series-8 green sitting ΔE 5.0 from the brand red under deuteranopia.
      - name: Verify the chart palette
        run: make palette

      # T-V5. The video's components run in a browser three packages from
      # tokens.json, where `color: "#0A0A0A"` is shorter than reading the value
      # off the plan and is wrong for every tenant with a brand colour — and
      # wrong silently, because the frame still renders.
      - name: Verify packages/motion names no colour of its own
        run: make motion-guards

      # Same shape as the API-type drift gate in T-02b: generated files are
      # committed, so a diff here means the committed output disagrees with
      # tokens.json — either it was hand-edited or it was never regenerated.
      - name: Fail on drift
        run: |
          git --no-pager diff --exit-code -- \
            packages/design-tokens \
            packages/motion/src/tokens.generated.ts \
            apps/dashboard/src/tokens.generated.css \
            apps/backend/internal/report/theme \
          || {
            echo "::error::Generated design tokens are stale. Run 'make tokens' and commit the result."
            exit 1
          }

  types:
    name: API types
    needs: changes
    if: needs.changes.outputs.types == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both toolchains: node runs the generator, Go parses the structs. No
      # pnpm install — the generator has no dependencies, deliberately, so this
      # job cannot be broken by a lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/backend/go.sum

      - name: Regenerate the API types
        run: make types

      # The gate the ticket asks for: a Go struct that changed without a
      # regeneration is a red build. The committed output is what the dashboard
      # compiles against, so a diff here means the dashboard is type-checking
      # against a contract the backend no longer serves.
      - name: Fail on drift
        run: |
          git --no-pager diff --exit-code -- packages/api-types \
          || {
            echo "::error::packages/api-types is stale. Run 'make types' and commit the result."
            exit 1
          }

  deck:
    name: Deck compatibility
    needs: changes
    if: needs.changes.outputs.report == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/backend/go.sum

      # LibreOffice is the strictest of the four applications T-R4 targets about
      # malformed OOXML: a deck it refuses is a deck PowerPoint may also refuse,
      # and unlike the other three it can be asked in a headless runner. The
      # fonts are here so the conversion substitutes a real face rather than
      # falling back to whatever a bare container has, which is how a "passing"
      # conversion can still be a blank page.
      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-impress fonts-liberation

      - name: Convert every fixture deck
        run: go test -count=1 -v -run 'TestLibreOfficeConverts' ./internal/report/pptx/

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all workspace packages
        run: pnpm -r build

      # dashboard: eslint. landing: `tsc -b --noEmit` (typecheck, not eslint).
      - name: Lint
        run: pnpm -r lint

      # `pnpm -r build` regenerated the SDK's TypeScript types, the Python
      # SDK's types and the Postman collection from apps/backend/openapi/v1.yaml.
      # All three are committed, so a diff here means the committed copy
      # disagrees with the spec — the same gate the design tokens have, for the
      # same reason: two copies of one truth disagree quietly.
      - name: Fail on generated-artifact drift
        run: |
          git --no-pager diff --exit-code -- \
            packages/argentum-node/src/types.generated.ts \
            packages/argentum-python/src/argentum/types.py \
            apps/backend/docs/postman \
          || {
            echo "::error::Generated API artifacts are stale. Run 'make openapi' and commit the result."
            exit 1
          }

  api-examples:
    name: API examples (deterministic)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # Every sample published in docs/api/quickstart.md is executed here against
    # a real server. An example that has never been run is a support ticket with
    # a delay fuse.
    #
    # **Only the deterministic half.** These cost a render — no LLM, no tokens —
    # so they run on every push. The two that spend the demo tenant's money
    # (POST /v1/reports, POST /v1/chat) run in nightly.yaml instead: putting a
    # real agent turn in the per-push path would bill an LLM call for every
    # commit in the monorepo.
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: argentum
          POSTGRES_PASSWORD: argentum
          POSTGRES_DB: argentum
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U argentum"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/backend/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # MinIO is a `docker run` rather than a service container because it needs
      # a command argument (`server /data`) and the services block has nowhere
      # to put one. The render door answers a typed 503 without object storage,
      # so this is not optional for these samples.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done

      - name: Start the API
        working-directory: apps/backend
        env:
          # Config.Validate insists on these four. The deterministic samples
          # never reach an LLM or WhatsApp — the render door is a spec in and a
          # file out — so placeholders are honest here rather than a shortcut.
          LLM_API_KEY: ci-placeholder
          WHATSAPP_ACCESS_TOKEN: ci-placeholder
          WHATSAPP_PHONE_NUMBER_ID: ci-placeholder
          ARGENTUM_JWT_SECRET: 0123456789abcdef0123456789abcdef
          ARGENTUM_DSN_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: argentum
          DB_PASSWORD: argentum
          DB_NAME: argentum
          REDIS_URL: localhost:6379
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          API_V1_ENABLED: 'true'
        run: |
          go build -o /tmp/api ./cmd/api
          /tmp/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/ready && break
            sleep 2
          done
          curl -sf http://localhost:8080/ready || { cat /tmp/api.log; exit 1; }

      # A company and a key, over the same routes a tenant uses. Minting the key
      # by writing a row would skip the hashing and prove nothing about the
      # credential an integrator actually holds.
      - name: Mint an API key
        run: |
          token=$(curl -sf -X POST http://localhost:8080/api/auth/signup \
            -H 'Content-Type: application/json' \
            -d '{"company_name":"CI Examples","email":"ci@example.test","password":"ci-password-123"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          key=$(curl -sf -X POST http://localhost:8080/api/api-keys \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"quickstart","scopes":["write:reports","read:documents","write:chat","read:threads"]}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$key"
          echo "ARGENTUM_API_KEY=$key" >> "$GITHUB_ENV"
          echo "ARGENTUM_BASE_URL=http://localhost:8080" >> "$GITHUB_ENV"

      - name: Run every deterministic sample
        run: ./docs/api/examples/run.sh deterministic

      - name: API log
        if: failure()
        run: cat /tmp/api.log

  docker:
    name: Build & Push Docker Image
    needs: [changes, backend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: argentum-api
            dockerfile: Dockerfile.api
          - image: argentum-worker
            dockerfile: Dockerfile.worker
          - image: argentum-discord
            dockerfile: Dockerfile.discord
    steps:
      - uses: actions/checkout@v4

      # GHCR_TOKEN, not PAT: publishing images and minting release tags are
      # separate jobs and now hold separate credentials, so one expiring stops
      # one of them instead of both. PAT belongs to release.yaml alone.
      #
      # It cannot be secrets.GITHUB_TOKEN, tempting as that is for a job that
      # already declares `packages: write`. That token can only write packages
      # in the repository owner's namespace, and IMAGE_OWNER is haritsrizkall
      # while the repository is fauzanebd/argentum — so GHCR_TOKEN has to be a
      # PAT belonging to IMAGE_OWNER (or an account with write access to that
      # namespace) carrying write:packages. Change the username below with it.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Build context is apps/backend now, not the repo root.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
