name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile.api'
      - 'Dockerfile.worker'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile.api'
      - 'Dockerfile.worker'
      - '.github/workflows/ci.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: haritsrizkall
  GO_VERSION: '1.25'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Build api
        run: go build -o api ./cmd/api

      - name: Build worker
        run: go build -o worker ./cmd/worker

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: argentum-api
            dockerfile: Dockerfile.api
          - image: argentum-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: haritsrizkall
          password: ${{ secrets.PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  cleanup:
    name: Cleanup Old Images
    runs-on: ubuntu-latest
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write
    strategy:
      matrix:
        image: [argentum-api, argentum-worker]
    steps:
      - name: Delete old container images
        uses: snok/container-retention-policy@v3.0.0
        with:
          account: ${{ env.IMAGE_OWNER }}
          token: ${{ secrets.PAT }}
          image-names: ${{ matrix.image }}
          cut-off: 6h
          keep-n-most-recent: 3
          account-type: personal
