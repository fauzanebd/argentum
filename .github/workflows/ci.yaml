name: CI

# No top-level `paths:` filter. The pre-monorepo workflow filtered the whole
# trigger on '**.go', which meant a frontend-only or config-only change ran no
# CI at all (gap Q-3). Filtering now happens per-job via the `changes` job, so
# every push is evaluated and only the relevant jobs execute.
on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: haritsrizkall
  # Matches apps/backend/go.mod (go 1.26.1). Previously pinned to 1.25, which
  # silently triggered a GOTOOLCHAIN=auto toolchain download on every run.
  GO_VERSION: '1.26'
  PNPM_VERSION: '10'
  NODE_VERSION: '22'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      tokens: ${{ steps.filter.outputs.tokens }}
      report: ${{ steps.filter.outputs.report }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - '.github/workflows/ci.yaml'
            # Both generated outputs are listed, not just the source: the point
            # of the tokens job is to catch a hand edit to a generated file as
            # well as a tokens.json change that was never regenerated.
            tokens:
              - 'packages/design-tokens/**'
              - 'apps/dashboard/src/tokens.generated.css'
              - 'apps/backend/internal/report/theme/**'
              - 'Makefile'
              - '.github/workflows/ci.yaml'
            # The deck smoke test installs LibreOffice, which costs about a
            # minute. It is worth that on a change to the renderers and nothing
            # at all on a change anywhere else, so it gets its own filter rather
            # than riding along in the backend job.
            report:
              - 'apps/backend/internal/report/**'
              - 'apps/backend/internal/tools/generate_document.go'
              - '.github/workflows/ci.yaml'
            web:
              - 'apps/dashboard/**'
              - 'apps/landing/**'
              - 'apps/widget/**'
              - 'packages/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yaml'

  backend:
    name: Backend
    needs: changes
    # Tag pushes must always run this job: `dorny/paths-filter` has no base ref to
    # diff a tag against, so it reports no changes, which would skip this job —
    # and skipping it cascades to `docker` (a skipped dependency skips its
    # dependents), silently stopping image publication on every release.
    if: needs.changes.outputs.backend == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      # golangci-lint also runs govet, so the step above is strictly redundant.
      # It stays because it is two seconds and it fails with a plain compiler
      # message; a vet finding should not arrive dressed as a lint finding.
      # The config is apps/backend/.golangci.yml — five linters plus a gofmt
      # check, deliberately narrow (T-02).
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
          working-directory: apps/backend

      - name: Test
        run: go test -race -count=1 ./...

      # cmd/discord was never built by the pre-monorepo pipeline — a compile
      # error in the Discord gateway could reach main undetected.
      - name: Build binaries
        run: |
          go build -o /tmp/api     ./cmd/api
          go build -o /tmp/worker  ./cmd/worker
          go build -o /tmp/discord ./cmd/discord

  tokens:
    name: Design tokens
    needs: changes
    if: needs.changes.outputs.tokens == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The generators have no dependencies on purpose, so this job installs
      # nothing: node runs them, and Go is here only for the gofmt check inside
      # `make tokens`.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/backend/go.sum

      - name: Regenerate design tokens
        run: make tokens

      # A palette edit that reads fine on a monitor can be unreadable to a
      # red-green-deficient reader or on a monochrome printer, and neither
      # failure shows up in a diff. This is the gate that saw the original
      # series-8 green sitting ΔE 5.0 from the brand red under deuteranopia.
      - name: Verify the chart palette
        run: make palette

      # Same shape as the API-type drift gate in T-02b: generated files are
      # committed, so a diff here means the committed output disagrees with
      # tokens.json — either it was hand-edited or it was never regenerated.
      - name: Fail on drift
        run: |
          git --no-pager diff --exit-code -- \
            packages/design-tokens \
            apps/dashboard/src/tokens.generated.css \
            apps/backend/internal/report/theme \
          || {
            echo "::error::Generated design tokens are stale. Run 'make tokens' and commit the result."
            exit 1
          }

  deck:
    name: Deck compatibility
    needs: changes
    if: needs.changes.outputs.report == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/backend/go.sum

      # LibreOffice is the strictest of the four applications T-R4 targets about
      # malformed OOXML: a deck it refuses is a deck PowerPoint may also refuse,
      # and unlike the other three it can be asked in a headless runner. The
      # fonts are here so the conversion substitutes a real face rather than
      # falling back to whatever a bare container has, which is how a "passing"
      # conversion can still be a blank page.
      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-impress fonts-liberation

      - name: Convert every fixture deck
        run: go test -count=1 -v -run 'TestLibreOfficeConverts' ./internal/report/pptx/

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all workspace packages
        run: pnpm -r build

      # dashboard: eslint. landing: `tsc -b --noEmit` (typecheck, not eslint).
      - name: Lint
        run: pnpm -r lint

  docker:
    name: Build & Push Docker Image
    needs: [changes, backend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: argentum-api
            dockerfile: Dockerfile.api
          - image: argentum-worker
            dockerfile: Dockerfile.worker
          - image: argentum-discord
            dockerfile: Dockerfile.discord
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: haritsrizkall
          password: ${{ secrets.PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Build context is apps/backend now, not the repo root.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
